  body { margin: 0; padding: 24px; background: #fff; color: #000;

  #stage { max-width: 640px; }
  #stage > * { margin-bottom: 12px; }
  .field { display: block; box-sizing: border-box; width: 100%; min-height: 2.2em;

  textarea.field { min-height: 6em; resize: none; }
  .field:focus { border-color: #000; }
  .ql-container { border: none; font: inherit; }
